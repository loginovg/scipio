syntax = "proto3";

package scipio.saga.v1;

option go_package = "scipio/gen/proto;sagav1";

service SagaService {
  rpc StartSaga(StartSagaRequest) returns (StartSagaResponse);
  rpc GetSaga(GetSagaRequest) returns (GetSagaResponse);
  rpc CancelSaga(CancelSagaRequest) returns (CancelSagaResponse);
}

message StartSagaRequest {
  string workflow = 1;
  bytes context = 2;
}

message StartSagaResponse {
  string id = 1;
}

message GetSagaRequest {
  string id = 1;
}

message GetSagaResponse {
  Saga saga = 1;
}

message CancelSagaRequest {
  string id = 1;
}

message CancelSagaResponse {
  Saga saga = 1;
}

message Saga {
  string id = 1;
  string workflow = 2;
  SagaStatus status = 3;
  bytes context = 4;
  repeated SagaStep steps = 5;
  string created_at = 6;
  string updated_at = 7;
}

message SagaStep {
  string name = 1;
  SagaStepStatus status = 2;
  uint32 attempt = 3;
  string started_at = 4;
  string finished_at = 5;
  string error = 6;
}

enum SagaStatus {
  SAGA_STATUS_UNSPECIFIED = 0;
  SAGA_STATUS_CREATED = 1;
  SAGA_STATUS_RUNNING = 2;
  SAGA_STATUS_COMPLETED = 3;
  SAGA_STATUS_CANCELING = 4;
  SAGA_STATUS_COMPENSATED = 5;
  SAGA_STATUS_FAILED = 6;
}

enum SagaStepStatus {
  SAGA_STEP_STATUS_UNSPECIFIED = 0;
  SAGA_STEP_STATUS_PENDING = 1;
  SAGA_STEP_STATUS_RUNNING = 2;
  SAGA_STEP_STATUS_COMPLETED = 3;
  SAGA_STEP_STATUS_COMPENSATING = 4;
  SAGA_STEP_STATUS_COMPENSATED = 5;
  SAGA_STEP_STATUS_FAILED = 6;
}
